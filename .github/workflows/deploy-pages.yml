name: Publiceer Nuvoro website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Haal websitecode op
        uses: actions/checkout@v5

      - name: Maak publicatiepakket
        run: |
          mkdir -p public/css public/js
          cp index.html contact.html over-ons.html process-scan.html public/
          cp css/style.css public/css/
          cp js/main.js public/js/

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload alleen publieke websitebestanden
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
